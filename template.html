<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub 关注点 · ahaodev</title>
<style>
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --wash:rgba(11,11,11,.05);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6;
}
/*DARK_MEDIA*/
/*DARK_ATTR*/
*{box-sizing:border-box}
html{background:var(--plane)}
body{margin:0;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--plane)}
a{color:inherit}
.page{max-width:1120px;margin:0 auto;padding:32px 20px 72px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{color:var(--ink2);font-size:13px;margin:0 0 4px}
h1{font-size:28px;line-height:1.25;margin:0;font-weight:700}
.sub{color:var(--ink2);margin:6px 0 0}
h2{font-size:18px;margin:0 0 4px;font-weight:700}
.note{color:var(--ink2);font-size:13px;margin:0}
section{margin-top:40px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:20px}
button,select,input{font:inherit;color:var(--ink)}
.btn{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--wash)}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--wash);color:var(--ink);font-weight:600}
/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.hero .big{font-size:56px;line-height:1.1;font-weight:700;margin:2px 0}
.hero .lbl{color:var(--ink2);font-size:14px;margin:0}
.hero .tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.kpi .v{font-size:28px;font-weight:700;line-height:1.2}
.kpi .l{color:var(--ink2);font-size:13px}
/* timeline */
.tl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#tl{position:relative}
#tl svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:12px}
.legend button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ring);background:var(--surface);border-radius:999px;padding:3px 12px 3px 10px;cursor:pointer;font-size:13px;color:var(--ink2)}
.legend button[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.legend b{color:var(--ink);font-weight:600}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px;min-width:190px;display:none}
.tip .h{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:16px}
.tip .r{display:flex;align-items:center;gap:8px;padding:1px 0}
.tip .r span.n{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:12px}
.tip .r .p{color:var(--muted);width:40px;text-align:right;font-variant-numeric:tabular-nums}
/* theme cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:16px}
.tc{display:flex;flex-direction:column;gap:10px}
.tc .hd{display:flex;align-items:center;gap:10px}
.tc .hd h3{margin:0;font-size:16px}
.tc .cnt{margin-left:auto;font-size:26px;font-weight:700;line-height:1}
.bar{height:6px;border-radius:3px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.tc .st{display:flex;justify-content:space-between;color:var(--ink2);font-size:13px;gap:8px;flex-wrap:wrap}
.tc svg{width:100%;height:44px;display:block}
.tc .top3{margin:0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.tc .top3 li{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.tc .top3 a{text-decoration:none;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc .top3 a:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ring);background:transparent;border-radius:6px;padding:1px 8px;font-size:12px;color:var(--ink2);cursor:pointer}
.chip:hover{background:var(--wash);color:var(--ink)}
.tc .more{align-self:flex-start;margin-top:auto}
/* explorer */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.filters input[type=search],.filters select{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:6px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.filters label{display:inline-flex;gap:6px;align-items:center;color:var(--ink2);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--ink2);font-weight:600;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--axis)}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td a{font-weight:600;text-decoration:none}
td a:hover{text-decoration:underline}
.desc{color:var(--ink2);font-size:13px;margin-top:2px}
.badge{font-size:12px;color:var(--ink2);border:1px solid var(--ring);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:400}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.empty{padding:32px;text-align:center;color:var(--ink2)}
details.data{margin-top:14px}
details.data summary{cursor:pointer;color:var(--ink2);font-size:13px}
.scroll{overflow-x:auto}
.foot{margin-top:40px;color:var(--muted);font-size:12px}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}
  .hero .big{font-size:44px}.cards{grid-template-columns:1fr}
  .col-lang,.col-m{display:none}
}
@media (forced-colors:active){.bar i,.sw{forced-color-adjust:none}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <p class="eyebrow">GitHub · ahaodev</p>
      <h1>我的关注点：从 Android 到 AI</h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="btn" id="themeBtn" type="button" aria-label="切换主题">主题：自动</button>
  </div>

  <div class="hero" id="hero"></div>
  <div class="kpis" id="kpis"></div>

  <section aria-labelledby="h-tl">
    <div class="tl-head">
      <div>
        <h2 id="h-tl">每年 Star 的主题构成</h2>
        <p class="note" id="tlNote"></p>
      </div>
      <div class="seg" role="group" aria-label="显示方式">
        <button type="button" data-mode="pct" aria-pressed="true">占比</button>
        <button type="button" data-mode="cnt" aria-pressed="false">数量</button>
      </div>
    </div>
    <div class="card">
      <div id="tl"></div>
      <div class="legend" id="legend"></div>
      <details class="data"><summary>查看数据表（年份 × 主题）</summary><div class="scroll" id="tlTable"></div></details>
    </div>
  </section>

  <section aria-labelledby="h-th">
    <h2 id="h-th">七个关注主题</h2>
    <p class="note">按累计数量排序。点击子类可直接在下方清单中筛选。</p>
    <div class="cards" id="cards"></div>
  </section>

  <section aria-labelledby="h-ex" id="explorer">
    <h2 id="h-ex">全部仓库</h2>
    <p class="note" id="exCount"></p>
    <div class="filters">
      <input type="search" id="fq" placeholder="搜索仓库名 / 描述" aria-label="搜索">
      <select id="ft" aria-label="主题"></select>
      <select id="fc" aria-label="子类"></select>
      <select id="fy" aria-label="收藏年份"></select>
      <select id="fs" aria-label="排序">
        <option value="stars">按 ⭐ 数</option><option value="new">按收藏时间（新→旧）</option><option value="old">按收藏时间（旧→新）</option><option value="name">按名称</option>
      </select>
      <label><input type="checkbox" id="fa" checked>含已归档</label>
    </div>
    <div class="card scroll" style="padding:8px 8px 14px">
      <table><thead><tr><th>仓库</th><th>子类</th><th class="col-lang">语言</th><th class="num">⭐</th><th class="num col-m">收藏于</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="empty" id="empty" hidden>没有符合条件的仓库</div>
      <div style="text-align:center;margin-top:12px"><button class="btn" id="moreBtn" type="button" hidden>显示更多</button></div>
    </div>
  </section>

  <p class="foot">分类由「仓库名 + topics + 描述 + 语言」的关键词规则自动生成，并对星数靠前的仓库做了人工校正；个别仓库仍可能归错类。数据来自 gh api user/starred（含 starred_at）。</p>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script id="data" type="application/json">/*DATA*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const T = D.themes, R = D.repos, C = D.cats;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n.toLocaleString("zh-CN");
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const sw = t => `<span class="sw" style="background:var(--s${t+1})"></span>`;
const y0 = Math.min(...R.map(r => r.y)), y1 = Math.max(...R.map(r => r.y));
const years = []; for (let y = y0; y <= y1; y++) years.push(y);
const yt = {}; years.forEach(y => yt[y] = T.map(() => 0));
R.forEach(r => yt[r.y][r.t]++);
const yTot = y => yt[y].reduce((a, b) => a + b, 0);
const tTot = T.map((_, i) => years.reduce((a, y) => a + yt[y][i], 0));
const N = R.length;

/* ---------- header / hero / kpis ---------- */
const peak = years.reduce((a, y) => yTot(y) > yTot(a) ? y : a, y0);
const peakTop = yt[peak].indexOf(Math.max(...yt[peak]));
const last = y1, lastTop = yt[last].indexOf(Math.max(...yt[last]));
$("sub").textContent = `${fmt(N)} 个 Star · ${y0}–${y1} · 归为 ${T.length} 个主题、${C.length} 个子类`;
$("hero").innerHTML = `
  <div class="card"><p class="lbl">${peak} 年（收藏高峰，共 ${fmt(yTot(peak))} 个）</p>
    <p class="big">${pct(yt[peak][peakTop], yTot(peak))}%</p>
    <p class="tag">${sw(peakTop)}${esc(T[peakTop])} · ${fmt(yt[peak][peakTop])} 个</p></div>
  <div class="card"><p class="lbl">${last} 年至今（共 ${fmt(yTot(last))} 个）</p>
    <p class="big">${pct(yt[last][lastTop], yTot(last))}%</p>
    <p class="tag">${sw(lastTop)}${esc(T[lastTop])} · ${fmt(yt[last][lastTop])} 个</p></div>`;
const rec2 = R.filter(r => r.y >= y1 - 1).length, arch = R.filter(r => r.a).length;
const kp = [[fmt(N), "累计 Star"], [fmt(rec2), `近两年新增（占 ${pct(rec2, N)}%）`], [`${T.length} / ${C.length}`, "主题 / 子类"], [fmt(arch), `已归档仓库（占 ${pct(arch, N)}%）`]];
$("kpis").innerHTML = kp.map(k => `<div class="card kpi"><div class="v">${k[0]}</div><div class="l">${esc(k[1])}</div></div>`).join("");

/* ---------- timeline ---------- */
let mode = "pct"; const hidden = new Set();
const tip = $("tip");
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1,2,2.5,5,10]) if (m * p >= v) return m * p; return v; }
function drawTimeline(){
  const el = $("tl"), w = Math.max(320, el.clientWidth), h = w < 560 ? 280 : 340;
  const m = {l: 44, r: 8, t: 10, b: 44}, iw = w - m.l - m.r, ih = h - m.t - m.b;
  const vis = T.map((_, i) => i).filter(i => !hidden.has(i));
  const tot = y => vis.reduce((a, i) => a + yt[y][i], 0);
  const maxV = mode === "pct" ? 1 : niceMax(Math.max(1, ...years.map(tot)));
  const band = iw / years.length, bw = Math.min(44, band * 0.62);
  const Y = v => m.t + ih - v / maxV * ih;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="每年 Star 的主题构成堆叠柱状图，数据见下方数据表">`;
  const ticks = mode === "pct" ? [0, .25, .5, .75, 1] : [0, .25, .5, .75, 1].map(f => Math.round(maxV * f));
  ticks.forEach(t => {
    const yy = Y(t);
    s += `<line x1="${m.l}" x2="${w - m.r}" y1="${yy}" y2="${yy}" style="stroke:${t === 0 ? "var(--axis)" : "var(--grid)"}" stroke-width="1"/>`;
    s += `<text x="${m.l - 8}" y="${yy + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${mode === "pct" ? Math.round(t * 100) + "%" : t}</text>`;
  });
  years.forEach((y, k) => {
    const cx = m.l + band * (k + .5), T0 = tot(y);
    s += `<rect class="hv" data-y="${y}" x="${cx - band / 2}" y="${m.t}" width="${band}" height="${ih}" style="fill:transparent"/>`;
    let acc = 0;
    vis.forEach(i => {
      const c = yt[y][i]; if (!c) return;
      const a = mode === "pct" ? acc / T0 : acc, b = mode === "pct" ? (acc + c) / T0 : acc + c;
      const yTop = Y(b), hh = Math.max(0, Y(a) - yTop);
      s += `<rect x="${cx - bw / 2}" y="${yTop}" width="${bw}" height="${hh}" style="fill:var(--s${i + 1});stroke:var(--surface)" stroke-width="2" pointer-events="none"/>`;
      acc += c;
    });
    s += `<text x="${cx}" y="${h - m.b + 17}" text-anchor="middle" font-size="12" style="fill:var(--ink2)">${w < 560 ? String(y).slice(2) : y}</text>`;
    s += `<text x="${cx}" y="${h - m.b + 32}" text-anchor="middle" font-size="11" style="fill:var(--muted)">n=${T0}</text>`;
  });
  s += `<rect id="band" x="0" y="${m.t}" width="${band}" height="${ih}" style="fill:var(--wash)" visibility="hidden" pointer-events="none"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector("svg"), bandEl = svg.querySelector("#band");
  svg.querySelectorAll(".hv").forEach(r => {
    const y = +r.dataset.y;
    const show = e => {
      bandEl.setAttribute("x", r.getAttribute("x")); bandEl.setAttribute("visibility", "visible");
      const T0 = tot(y);
      tip.innerHTML = `<div class="h"><span>${y} 年</span><span>${T0} 个</span></div>` +
        vis.slice().sort((a, b) => yt[y][b] - yt[y][a]).map(i => `<div class="r">${sw(i)}<span>${esc(T[i])}</span><span class="n">${yt[y][i]}</span><span class="p">${pct(yt[y][i], T0)}%</span></div>`).join("");
      tip.style.display = "block";
      const pad = 14, tw = tip.offsetWidth, th = tip.offsetHeight;
      let x = e.clientX + pad, yy = e.clientY + pad;
      if (x + tw > innerWidth - 8) x = e.clientX - tw - pad;
      if (yy + th > innerHeight - 8) yy = innerHeight - th - 8;
      tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, yy) + "px";
    };
    r.addEventListener("pointerenter", show); r.addEventListener("pointermove", show);
    r.addEventListener("pointerleave", () => { tip.style.display = "none"; bandEl.setAttribute("visibility", "hidden"); });
  });
}
function drawLegend(){
  $("legend").innerHTML = T.map((n, i) => `<button type="button" data-i="${i}" aria-pressed="${!hidden.has(i)}">${sw(i)}<span>${esc(n)}</span><b>${fmt(tTot[i])}</b></button>`).join("");
  $("legend").querySelectorAll("button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (hidden.has(i)) hidden.delete(i); else if (hidden.size < T.length - 1) hidden.add(i);
    drawLegend(); drawTimeline();
  });
}
function drawTable(){
  $("tlTable").innerHTML = `<table><thead><tr><th>年份</th>${T.map(n => `<th class="num">${esc(n)}</th>`).join("")}<th class="num">合计</th></tr></thead><tbody>` +
    years.map(y => `<tr><td>${y}</td>${yt[y].map(v => `<td class="num">${v}</td>`).join("")}<td class="num">${yTot(y)}</td></tr>`).join("") +
    `<tr><td><b>合计</b></td>${tTot.map(v => `<td class="num"><b>${v}</b></td>`).join("")}<td class="num"><b>${N}</b></td></tr></tbody></table>`;
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  drawTimeline();
});
$("tlNote").textContent = "每根柱子是当年新增的 Star；柱底 n 为当年总数。点击图例可隐藏某个主题，悬停查看明细。";
drawLegend(); drawTable(); drawTimeline();
new ResizeObserver(drawTimeline).observe($("tl"));

/* ---------- theme cards ---------- */
const order = T.map((_, i) => i).sort((a, b) => tTot[b] - tTot[a]);
const recentAll = R.filter(r => r.y >= y1 - 1).length;
function sparkline(i, col){
  const vals = years.map(y => yt[y][i]), mx = Math.max(1, ...vals), W = 300, H = 44, bw = W / vals.length;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(T[i])} 每年新增数量">` +
    vals.map((v, k) => `<rect x="${k * bw + 2}" y="${H - v / mx * (H - 2)}" width="${bw - 4}" height="${Math.max(v ? 2 : 0, v / mx * (H - 2))}" rx="2" style="fill:${col}"><title>${years[k]}：${v}</title></rect>`).join("") +
    `<line x1="0" x2="${W}" y1="${H - .5}" y2="${H - .5}" style="stroke:var(--axis)"/></svg>`;
}
$("cards").innerHTML = order.map(i => {
  const mine = R.filter(r => r.t === i), rec = mine.filter(r => r.y >= y1 - 1).length;
  const top = mine.slice().sort((a, b) => b.s - a.s).slice(0, 3);
  const cats = {}; mine.forEach(r => cats[r.c] = (cats[r.c] || 0) + 1);
  const col = `var(--s${i + 1})`;
  return `<article class="card tc">
    <div class="hd">${sw(i)}<h3>${esc(T[i])}</h3><span class="cnt">${fmt(mine.length)}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${mine.length / N * 100}%;background:${col}"></i></div>
    <div class="st"><span>累计占 ${pct(mine.length, N)}%</span><span>近两年占新增 ${pct(rec, recentAll)}%（${rec} 个）</span></div>
    ${sparkline(i, col)}
    <ul class="top3">${top.map(r => `<li><a href="https://github.com/${esc(r.n)}" target="_blank" rel="noopener">${esc(r.n)}</a><span>⭐ ${fmt(r.s)}</span></li>`).join("")}</ul>
    <div class="chips">${Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<button class="chip" type="button" data-t="${i}" data-c="${esc(c)}">${esc(c.replace(/^Android · /, ""))} ${n}</button>`).join("")}</div>
    <button class="btn more" type="button" data-t="${i}">查看全部 ${fmt(mine.length)} 个 →</button>
  </article>`;
}).join("");

/* ---------- explorer ---------- */
const st = {q: "", t: "", c: "", y: "", s: "stars", a: true, n: 100};
$("ft").innerHTML = '<option value="">全部主题</option>' + T.map((n, i) => `<option value="${i}">${esc(n)}</option>`).join("");
$("fy").innerHTML = '<option value="">全部年份</option>' + years.slice().reverse().map(y => `<option>${y}</option>`).join("");
function fillCats(){
  const list = C.filter(c => st.t === "" || c.t === +st.t);
  $("fc").innerHTML = '<option value="">全部子类</option>' + list.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("");
  $("fc").value = st.c;
}
function renderRows(){
  const q = st.q.trim().toLowerCase();
  const list = R.filter(r => (st.t === "" || r.t === +st.t) && (!st.c || r.c === st.c) && (!st.y || r.y === +st.y) && (st.a || !r.a) &&
    (!q || r.n.toLowerCase().includes(q) || r.d.toLowerCase().includes(q)));
  const by = {stars: (a, b) => b.s - a.s, new: (a, b) => b.m.localeCompare(a.m) || b.s - a.s, old: (a, b) => a.m.localeCompare(b.m) || b.s - a.s, name: (a, b) => a.n.localeCompare(b.n)}[st.s];
  list.sort(by);
  $("exCount").textContent = `共 ${fmt(list.length)} 个，当前显示 ${fmt(Math.min(list.length, st.n))} 个`;
  $("rows").innerHTML = list.slice(0, st.n).map(r => `<tr>
    <td><a href="https://github.com/${esc(r.n)}" target="_blank" rel="noopener">${esc(r.n)}</a>${r.a ? '<span class="badge">已归档</span>' : ""}<div class="desc">${esc(r.d)}</div></td>
    <td><span class="cat">${sw(r.t)}${esc(r.c)}</span></td><td class="col-lang">${esc(r.l)}</td><td class="num">${fmt(r.s)}</td><td class="num col-m">${esc(r.m)}</td></tr>`).join("");
  $("empty").hidden = list.length > 0; $("moreBtn").hidden = list.length <= st.n;
}
function sync(){ $("ft").value = st.t; fillCats(); $("fy").value = st.y; $("fs").value = st.s; $("fa").checked = st.a; renderRows(); }
$("fq").oninput = e => { st.q = e.target.value; st.n = 100; renderRows(); };
$("ft").onchange = e => { st.t = e.target.value; st.c = ""; st.n = 100; fillCats(); renderRows(); };
$("fc").onchange = e => { st.c = e.target.value; st.n = 100; renderRows(); };
$("fy").onchange = e => { st.y = e.target.value; st.n = 100; renderRows(); };
$("fs").onchange = e => { st.s = e.target.value; renderRows(); };
$("fa").onchange = e => { st.a = e.target.checked; st.n = 100; renderRows(); };
$("moreBtn").onclick = () => { st.n += 200; renderRows(); };
$("cards").addEventListener("click", e => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  st.t = b.dataset.t; st.c = b.dataset.c || ""; st.n = 100; sync();
  $("explorer").scrollIntoView({behavior: "smooth", block: "start"});
});
sync();

/* ---------- theme toggle ---------- */
const modes = ["auto", "light", "dark"], names = {auto: "自动", light: "浅色", dark: "深色"};
let cur = "auto"; try { cur = localStorage.getItem("stars-theme") || "auto"; } catch (e) {}
function applyTheme(){ if (cur === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = cur; $("themeBtn").textContent = "主题：" + names[cur]; }
$("themeBtn").onclick = () => { cur = modes[(modes.indexOf(cur) + 1) % 3]; try { localStorage.setItem("stars-theme", cur); } catch (e) {} applyTheme(); };
applyTheme();
</script>
</body>
</html>
